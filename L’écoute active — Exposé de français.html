1<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L’écoute active — Exposé de français</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ff;--fg:#0d1230;--mut:#4a5178;--card:rgba(255,255,255,.7);--bd:rgba(13,18,48,.12);--a1:#3550ff;--a2:#ff3d8b;--ok:#11a56a;--ko:#e5384f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a1c;--fg:#eaedff;--mut:#9aa3d6;--card:rgba(20,26,62,.65);--bd:rgba(160,175,255,.18);--a1:#52e3ff;--a2:#b583ff;--ok:#3ee59a;--ko:#ff6b81}}
:root[data-theme="dark"]{--bg:#060a1c;--fg:#eaedff;--mut:#9aa3d6;--card:rgba(20,26,62,.65);--bd:rgba(160,175,255,.18);--a1:#52e3ff;--a2:#b583ff;--ok:#3ee59a;--ko:#ff6b81}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1.06rem/1.65 Figtree,system-ui,sans-serif;transition:background .5s,color .5s;overflow-x:hidden}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,sans-serif;line-height:1.05;margin:0 0 .5em}
.waves{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(500px circle at var(--mx,50%) var(--my,30%),color-mix(in srgb,var(--a1) 18%,transparent),transparent 70%)}
main,nav,footer{position:relative;z-index:1}
nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:.4rem;padding:calc(.7rem + env(safe-area-inset-top,0px)) 1.2rem .7rem;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--bd)}
nav b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.1rem;margin-right:auto}
nav a{color:var(--mut);text-decoration:none;font-size:.92rem;padding:.3rem .6rem;border-radius:99px;transition:.2s}
nav a:hover{color:var(--fg);background:var(--card)}
.tg{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:99px;padding:.35rem .8rem;cursor:pointer;font:inherit;font-size:.9rem}
@media(max-width:760px){nav a{display:none}}
section{max-width:980px;margin:0 auto;padding:6.5rem 1.4rem 1rem}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:clamp(3.2rem,12vw,9rem);font-weight:800;letter-spacing:-.04em;margin:0}
.hero h1 span{display:block;background:linear-gradient(100deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 20s ease-in-out infinite alternate;background-size:200% 100%}
@keyframes sh{to{background-position:100% 0}}
.hero p{max-width:34rem;color:var(--mut);font-size:1.2rem}
.who{display:inline-block;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:.4rem 1rem;font-size:.95rem;width:fit-content}
h2{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.03em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:1.5rem;backdrop-filter:blur(10px)}
.rv{opacity:0;transform:translateY(26px);transition:opacity 1.6s,transform 1.6s}.rv.in{opacity:1;transform:none}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(1.5rem,3.6vw,2.4rem);line-height:1.2;font-weight:500}
.plan{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.plan a{color:inherit;text-decoration:none;transition:transform .25s,border-color .25s}
.plan a:hover{transform:translateY(-6px);border-color:var(--a1)}
.plan h3{font-size:1.4rem}.plan .n{font-family:"Bricolage Grotesque";font-size:3rem;font-weight:800;color:var(--a1)}
.sw{display:flex;gap:.4rem;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:.3rem;width:fit-content;margin:1rem 0}
.sw button,.tabs button{border:0;background:none;color:var(--mut);font:inherit;padding:.5rem 1.2rem;border-radius:99px;cursor:pointer;transition:.25s}
.sw button.on,.tabs button.on{background:linear-gradient(100deg,var(--a1),var(--a2));color:#fff}
.dark-on-a{color:#fff}
.ear{display:flex;gap:3px;align-items:center;height:60px;margin:.5rem 0}
.ear i{width:6px;border-radius:9px;background:linear-gradient(var(--a1),var(--a2));transition:height 1.2s}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:1.2rem}
.flip{perspective:900px;height:210px;cursor:pointer;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.flip>div{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.flip.on>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;padding:1.3rem;border-radius:22px;border:1px solid var(--bd);background:var(--card)}
.flip .b{transform:rotateY(180deg);background:linear-gradient(140deg,color-mix(in srgb,var(--a1) 25%,var(--bg)),color-mix(in srgb,var(--a2) 25%,var(--bg)));font-size:.96rem}
.flip .e{font-size:2.2rem}.flip h3{font-size:1.35rem;margin:.2rem 0}.flip small{color:var(--mut)}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.tabs button{border:1px solid var(--bd)}
ul.l{padding-left:1.2rem;color:var(--mut)}ul.l b{color:var(--fg)}
.qz{max-width:760px;margin:0 auto}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;margin-bottom:1.2rem}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .5s}
.opt{display:block;width:100%;text-align:left;margin:.6rem 0;padding:.9rem 1.1rem;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--a1);transform:translateX(6px)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 18%,transparent);animation:sk .4s}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.btn{border:0;border-radius:99px;padding:.8rem 1.6rem;font:600 1rem Figtree,sans-serif;color:#fff;background:linear-gradient(100deg,var(--a1),var(--a2));cursor:pointer;margin-top:1rem}
.btn:hover{filter:brightness(1.1)}
.sc{text-align:center}.sc svg{width:190px;height:190px}
.sc text{font:800 2.6rem "Bricolage Grotesque",sans-serif;fill:var(--fg)}
.hero{position:relative}
.logos{position:absolute;top:calc(4.6rem + env(safe-area-inset-top,0px));left:1.4rem;right:1.4rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.bub{max-width:82%;padding:.7rem 1rem;border-radius:18px;margin:.45rem 0;border:1px solid var(--bd);background:var(--bg)}
.bub.r{margin-left:auto;background:color-mix(in srgb,var(--a1) 18%,var(--bg))}
.lg{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:.55rem 1rem;display:flex}
.lg img{height:58px;width:auto;display:block}
.pw{font:inherit;padding:.8rem 1.1rem;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);text-align:center;width:min(260px,100%);margin:.5rem 0}
.pw.ko{border-color:var(--ko);animation:sk .4s}
.reel{width:100%;max-width:400px;height:640px;border:0;border-radius:18px;background:#fff}
footer{text-align:center;color:var(--mut);padding:4rem 1rem 3rem;font-size:.9rem}
button:focus-visible,a:focus-visible{outline:3px solid var(--a1);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>

<script>
const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);

function Reveal({children}){
  const r=useRef();
  useEffect(()=>{const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){e.target.classList.add("in");o.disconnect()}},{threshold:.12});o.observe(r.current);return()=>o.disconnect()},[]);
  return html`<div ref=${r} className="rv">${children}</div>`;
}

function Waves(){
  const c=useRef();
  useEffect(()=>{
    const cv=c.current,x=cv.getContext("2d");let w,h,t=0,id;const m={x:.5,y:.5};
    const rs=()=>{w=cv.width=innerWidth;h=cv.height=innerHeight};rs();
    const mm=e=>{m.x=e.clientX/w;m.y=e.clientY/h;const s=document.documentElement.style;s.setProperty("--mx",e.clientX+"px");s.setProperty("--my",e.clientY+"px")};
    addEventListener("resize",rs);addEventListener("mousemove",mm);
    const loop=()=>{
      t+=.004;x.clearRect(0,0,w,h);
      const s=getComputedStyle(document.documentElement),a=s.getPropertyValue("--a1").trim(),b=s.getPropertyValue("--a2").trim();
      for(let i=0;i<6;i++){
        x.beginPath();
        for(let p=0;p<=w;p+=8){
          const amp=26+i*12+m.y*70*Math.abs(Math.sin(t+i));
          const y=h*.55+Math.sin(p*.004+t*(1+i*.2)+i)*amp*Math.sin(p/w*Math.PI+m.x*2);
          p===0?x.moveTo(p,y):x.lineTo(p,y);
        }
        x.strokeStyle=i%2?a:b;x.globalAlpha=.12+i*.05;x.lineWidth=2;x.stroke();
      }
      id=requestAnimationFrame(loop);
    };
    loop();
    return()=>{cancelAnimationFrame(id);removeEventListener("resize",rs);removeEventListener("mousemove",mm)};
  },[]);
  return html`<canvas ref=${c} className="waves" aria-hidden="true"/>`;
}

function Ear({on}){
  const bars=Array.from({length:34},(_,i)=>i);
  return html`<div className="ear" aria-hidden="true">${bars.map(i=>html`<i key=${i} style=${{height:on?(14+Math.abs(Math.sin(i*.6))*44)+"px":"6px"}}/>`)}</div>`;
}

function Hero(){
  return html`<section className="hero" id="top"><div className="logos"><span className="lg"><img src=${LOGO_L} alt="ISGA, école d’ingénieur.e.s"/></span><span className="lg"><img src=${LOGO_R} alt="Edvantis Higher Education Group"/></span></div>
    <span className="who">Exposé de français · présenté par Mehdi Boutaibi</span>
    <h1>L’écoute<span>active</span></h1>
    <p>Entendre est un réflexe. Écouter est un choix. Bouge ta souris : les ondes t’écoutent.</p>
  </section>`;
}

function Intro(){
  return html`<section id="intro"><${Reveal}>
    <h2>Introduction</h2>
    <p className="big">On a tous déjà parlé à quelqu’un qui répondait « hmm » en regardant son téléphone. On a entendu ses sons. On ne s’est pas senti écouté.</p>
    <p>Dans un monde saturé de notifications, de messages vocaux et de conversations à moitié suivies, savoir écouter devient une compétence rare. Les psychologues Carl Rogers et Richard Farson l’ont théorisée dans les années 1950 sous le nom d’<b>écoute active</b> : une manière d’écouter qui montre à l’autre qu’il est compris, pas seulement entendu.</p>
    <p>Cet exposé part donc d’une question simple, mais décisive. Nous verrons d’abord ce qu’est l’écoute active, puis comment la pratiquer concrètement, et enfin ce qu’elle apporte réellement, avec les limites qu’il faut garder en tête.</p>
  <//></section>`;
}

function Problematique(){
  return html`<section id="problematique"><${Reveal}>
    <h2>Problématique</h2>
    <div className="card"><p className="big" style=${{margin:0}}>Dans quelle mesure l’écoute active transforme-t-elle une simple conversation en véritable communication ?</p></div>
  <//></section>`;
}

function Plan(){
  const p=[["p1","Comprendre","Définition, origine et principes de l’écoute active"],["p2","Pratiquer","Les techniques et les attitudes qui la rendent visible"],["p3","Mesurer","Ses bénéfices dans la vie réelle, et ses limites"]];
  return html`<section id="plan"><${Reveal}>
    <h2>Plan de l’exposé</h2>
    <div className="plan">${p.map((x,i)=>html`<a key=${x[0]} href=${"#"+x[0]} className="card"><div className="n">${i+1}</div><h3>${x[1]}</h3><span style=${{color:"var(--mut)"}}>${x[2]}</span></a>`)}</div>
  <//></section>`;
}

function P1(){
  const [e,setE]=useState(false);
  return html`<section id="p1"><${Reveal}>
    <h2>I. Comprendre l’écoute active</h2>
    <p>Commençons par la différence fondamentale. Clique pour la voir.</p>
    <div className="sw" role="group" aria-label="Entendre ou écouter">
      <button className=${!e?"on":""} onClick=${()=>setE(false)}>Entendre</button>
      <button className=${e?"on":""} onClick=${()=>setE(true)}>Écouter activement</button>
    </div>
    <div className="card">
      <${Ear} on=${e}/>
      <p className="big" style=${{margin:0}}>${e?"Un acte volontaire : on porte son attention sur les mots, les émotions et les intentions de l’autre.":"Un phénomène passif : les sons arrivent à l’oreille, sans effort ni intention."}</p>
    </div>
    <div className="grid">
      <div className="card"><h3>Définition</h3><p style=${{margin:0}}>Écouter activement, c’est s’engager dans l’échange : montrer, par ses paroles et son attitude, qu’on a compris le message de l’autre, y compris ce qui n’est pas dit clairement.</p></div>
      <div className="card"><h3>Ce qu’on écoute vraiment</h3><ul className="l" style=${{margin:0}}><li><b>Les mots</b> : le contenu du message</li><li><b>Le ton et le corps</b> : la manière de le dire</li><li><b>L’émotion</b> : ce que la personne ressent</li></ul></div>
      <div className="card"><h3>Origine</h3><p style=${{margin:0}}>Carl Rogers, psychologue américain, la développe dans le cadre de la relation d’aide, puis elle s’étend à l’école, à l’entreprise et à la vie quotidienne.</p></div>
      <div className="card"><h3>Trois piliers</h3><ul className="l" style=${{margin:0}}><li><b>Attention</b> : être pleinement présent</li><li><b>Empathie</b> : comprendre le point de vue de l’autre</li><li><b>Non-jugement</b> : accueillir sans critiquer</li></ul></div>
    </div>
  <//></section>`;
}

const TECH=[
  ["🔁","Reformuler","Redire avec ses mots","« Si je comprends bien, tu veux dire que… » Cela prouve qu’on a compris et permet à l’autre de corriger."],
  ["❓","Questions ouvertes","Inviter à développer","« Qu’est-ce qui t’a le plus gêné ? » Elles évitent le simple oui/non et approfondissent le sujet."],
  ["🤫","Le silence","Laisser de la place","Une pause de quelques secondes laisse l’autre réfléchir et aller plus loin dans ce qu’il veut dire."],
  ["👀","Le non-verbal","Le corps écoute aussi","Regard, hochement de tête, posture ouverte, téléphone rangé : le corps dit « je suis là » avant la voix."],
  ["💬","Valider l’émotion","Reconnaître ce qui est ressenti","« Je comprends que ce soit difficile. » On ne cherche pas à corriger l’émotion, on la reconnaît."],
  ["🚧","Les obstacles","Ce qu’il faut éviter","Couper la parole, juger, donner un conseil trop vite, ou préparer sa réponse pendant que l’autre parle."]
];
function Flip({t}){

  return html`<button className=${"flip"+(o?" on":"")} onClick=${()=>setO(!o)} aria-pressed=${o}><div>
    <span className="f"><span className="e">${t[0]}</span><h3>${t[1]}</h3><small>${t[2]} — clique</small></span>
    <span className="b">${t[3]}</span></div></button>`;
}
const DLG={
 "Sans écoute active":[["a","J’ai raté mon examen… je me sens nul."],["b","Ça arrive à tout le monde. Sinon, t’as vu le match hier ?"],["a","Ah… oui, peu importe."]],
 "Avec écoute active":[["a","J’ai raté mon examen… je me sens nul."],["b","Tu as l’air vraiment déçu. Qu’est-ce qui s’est passé, selon toi ?"],["a","J’ai mal géré mon temps."],["b","Si je comprends bien, tu as eu peur de ne pas finir. On regarde ensemble comment t’organiser ?"]]
};
const DNOTE={"Sans écoute active":"L’émotion est minimisée et le sujet change : la personne se referme.","Avec écoute active":"Validation de l’émotion, question ouverte, reformulation : la personne se sent comprise."};

    <h3>Mise en situation</h3>
    <div className="sw" role="group" aria-label="Type de réponse">${ks.map(x=>html`<button key=${x} className=${k===x?"on":""} onClick=${()=>setK(x)}>${x}</button>`)}</div>

}
function P2(){
  return html`<section id="p2"><${Reveal}>
    <h2>II. Les techniques et les attitudes</h2>
    <p>L’écoute active se voit autant qu’elle s’entend. Retourne chaque carte pour découvrir un exemple.</p>

  return html`<section id="p3"><${Reveal}>
    <h2>III. Bénéfices et limites</h2>
    <div className="tabs" role="tablist">${Object.keys(BEN).map(x=>html`<button key=${x} role="tab" className=${k===x?"on":""} onClick=${()=>setK(x)}>${x}</button>`)}</div>
    <div className="card"><p className="big" style=${{margin:0}} key=${k}>${BEN[k]}</p></div>
    <div className="card" style=${{marginTop:"1rem"}}><h3>Comment s’entraîner</h3>
      <ul className="l" style=${{margin:0}}>
        <li><b>Ranger son téléphone</b> pendant une conversation.</li>
        <li><b>Ne pas interrompre</b> pendant une minute entière.</li>
        <li><b>Reformuler avant de répondre</b>, même si l’on n’est pas d’accord.</li>
        <li><b>Repérer ses propres obstacles</b> : couper la parole, conseiller trop vite, juger.</li>
      </ul></div>
    <div className="card" style=${{marginTop:"1rem"}}><h3>Mais attention aux limites</h3>
      <ul className="l" style=${{margin:0}}>
        <li><b>Elle demande de l’énergie</b> : rester attentif longtemps fatigue.</li>
        <li><b>Elle peut sonner faux</b> si les techniques sont appliquées de manière mécanique.</li>
        <li><b>Elle peut être détournée</b> pour manipuler si elle n’est pas sincère.</li>
        <li><b>Elle varie selon les cultures</b> : regard et silence n’ont pas partout le même sens.</li>
      </ul></div>
  <//></section>`;
}

function Conclusion(){
  return html`<section id="conclusion"><${Reveal}>
    <h2>Conclusion</h2>
    <p className="big">L’écoute active transforme la conversation en communication parce qu’elle fait passer l’autre du statut de « public » à celui de « personne ».</p>
    <p>Nous avons vu ce qu’elle est (I), comment elle se pratique (II) et ce qu’elle apporte, avec ses limites (III). Elle n’a rien de magique : c’est un entraînement, fondé sur l’attention, l’empathie et la sincérité.</p>
    <div className="card"><h3>À retenir</h3><ul className="l" style=${{margin:0}}><li>Écouter activement, c’est un <b>choix</b> et un <b>entraînement</b>.</li><li>Elle repose sur l’<b>attention</b>, l’<b>empathie</b> et le <b>non-jugement</b>.</li><li>Elle est <b>puissante</b> quand elle est <b>sincère</b>, et fragile quand elle devient mécanique.</li></ul></div>
    <p style=${{marginTop:"1.2rem"}}><b>Ouverture :</b> à l’ère des écrans et de l’intelligence artificielle, peut-on encore écouter vraiment quand tout nous sollicite en même temps ? Pour le savoir, teste-toi avec le quiz.</p>
  <//></section>`;
}

const QZ=[
 ["Quelle est la différence principale entre entendre et écouter ?",["Entendre est volontaire","Écouter demande attention et intention","Il n’y en a aucune"],1,"Entendre est passif ; écouter est un acte volontaire."],
 ["Qui a théorisé l’écoute active dans les années 1950 ?",["Carl Rogers","Sigmund Freud","Albert Einstein"],0,"Carl Rogers, avec Richard Farson, dans la relation d’aide."],
 ["« Si je comprends bien, tu veux dire que… » est un exemple de :",["Question fermée","Reformulation","Conseil"],1,"Reformuler montre qu’on a compris et vérifie le message."],
 ["Laquelle est une question ouverte ?",["Tu es fâché ?","Tu viens demain ?","Comment as-tu vécu cette situation ?"],2,"Une question ouverte appelle une réponse développée."],
 ["Quel comportement bloque l’écoute active ?",["Couper la parole","Hocher la tête","Ranger son téléphone"],0,"Couper la parole ou préparer sa réponse empêche d’écouter."],
 ["Quelle est une limite de l’écoute active ?",["Elle ne sert à rien","Elle peut sembler artificielle si elle n’est pas sincère","Elle est interdite au travail"],1,"Utilisée mécaniquement ou pour manipuler, elle perd sa valeur."]
];
function Quiz(){
  const [i,setI]=useState(0),[s,setS]=useState(0),[p,setP]=useState(null);
  const done=i>=QZ.length,q=QZ[i];
  const pick=n=>{if(p!==null)return;setP(n);if(n===q[2])setS(s+1)};
  const next=()=>{setP(null);setI(i+1)};
  const rs=()=>{setI(0);setS(0);setP(null)};
  const pct=s/QZ.length,C=2*Math.PI*80;
  const msg=pct===1?"Parfait : tu écoutes vraiment !":pct>=.5?"Bien joué, tu as les bases.":"Relis l’exposé et retente ta chance.";
  return html`<section id="quiz"><${Reveal}><div className="qz">
    <h2>Quiz interactif</h2>
    <div className="card">
    ${done?html`<div className="sc">
      <svg viewBox="0 0 200 200" role="img" aria-label=${"Score "+s+" sur "+QZ.length}><circle cx="100" cy="100" r="80" fill="none" stroke="var(--bd)" strokeWidth="14"/><circle cx="100" cy="100" r="80" fill="none" stroke="var(--a1)" strokeWidth="14" strokeLinecap="round" strokeDasharray=${C} strokeDashoffset=${C*(1-pct)} transform="rotate(-90 100 100)" style=${{transition:"stroke-dashoffset 1.2s"}}/><text x="100" y="112" textAnchor="middle">${s}/${QZ.length}</text></svg>
      <p className="big">${msg}</p><button className="btn" onClick=${rs}>Recommencer</button></div>`
    :html`<div>
      <div className="bar"><i style=${{width:(i/QZ.length*100)+"%"}}/></div>
      <small style=${{color:"var(--mut)"}}>Question ${i+1} sur ${QZ.length}</small>
      <h3 style=${{fontSize:"1.5rem",marginTop:".3rem"}}>${q[0]}</h3>
      ${q[1].map((o,n)=>html`<button key=${n} disabled=${p!==null} className=${"opt"+(p!==null&&n===q[2]?" ok":"")+(p===n&&n!==q[2]?" ko":"")} onClick=${()=>pick(n)}>${o}</button>`)}
      ${p!==null&&html`<p style=${{color:"var(--mut)"}}><b>${p===q[2]?"Exact. ":"Pas tout à fait. "}</b>${q[3]}</p><button className="btn" onClick=${next}>${i===QZ.length-1?"Voir mon score":"Question suivante"}</button>`}
    </div>`}
    </div>
  </div><//></section>`;
}

function Video(){
  const [ok,setOk]=useState(false),[pw,setPw]=useState(""),[bad,setBad]=useState(false);
  const go=()=>{if(pw==="1515"){setOk(true);setBad(false)}else{setBad(true);setPw("");setTimeout(()=>setBad(false),600)}};
  return html`<section id="video"><${Reveal}><div className="qz">
    <h2>Vidéo</h2>
    <div className="card" style=${{textAlign:"center"}}>
    ${ok?html`<div>
      <iframe className="reel" src="https://www.instagram.com/reel/Ddt2aLmIJ_i/embed" title="Vidéo Instagram" allowFullScreen loading="lazy"></iframe>
      <p style=${{color:"var(--mut)"}}>La vidéo ne s’affiche pas ? Ouvre-la directement sur Instagram.</p>
      <a className="btn" style=${{display:"inline-block",textDecoration:"none"}} href="https://www.instagram.com/reel/Ddt2aLmIJ_i/?srtk=MXRtamU5MzZremI5cQ%3D%3D" target="_blank" rel="noopener noreferrer">Ouvrir sur Instagram</a></div>`
    :html`<div>
      <div style=${{fontSize:"2.6rem"}}>🔒</div>
      <p className="big">Contenu protégé</p>
      <p style=${{color:"var(--mut)"}}>Entre le mot de passe pour débloquer la vidéo.</p>
      <input className=${"pw"+(bad?" ko":"")} type="password" inputMode="numeric" value=${pw} placeholder="Mot de passe" aria-label="Mot de passe" onChange=${e=>setPw(e.target.value)} onKeyDown=${e=>e.key==="Enter"&&go()}/>
      <div><button className="btn" onClick=${go}>Débloquer</button></div>
      ${bad&&html`<p style=${{color:"var(--ko)"}}>Mot de passe incorrect.</p>`}
    </div>`}
    </div>
  </div><//></section>`;
}

function App(){
  const [th,setTh]=useState(()=>{try{const v=localStorage.getItem("th");if(v)return v}catch(e){}return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"});
  useEffect(()=>{document.documentElement.dataset.theme=th;try{localStorage.setItem("th",th)}catch(e){}},[th]);
  const L=[["intro","Intro"],["problematique","Problématique"],["plan","Plan"],["quiz","Quiz"],["video","Vidéo"]];
  return html`<${React.Fragment}>
    <${Waves}/><div className="glow"/>
    <nav><b>Écoute active</b>${L.map(l=>html`<a key=${l[0]} href=${"#"+l[0]}>${l[1]}</a>`)}
      <button className="tg" onClick=${()=>setTh(th==="dark"?"light":"dark")} aria-label="Changer de thème">${th==="dark"?"☀️ Clair":"🌙 Sombre"}</button></nav>
    <main><${Hero}/><${Intro}/><${Problematique}/><${Plan}/><${P1}/><${P2}/><${P3}/><${Conclusion}/><${Quiz}/><${Video}/></main>
    <footer>Exposé de français · Mehdi Boutaibi · Merci de votre écoute 🎧</footer>
  <//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
